name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check out the reviewed room snapshot
        if: github.event_name == 'push' && github.event.before == '431f7b48c1bd8338665ea1783984fe163e81faba' && startsWith(github.event.head_commit.message, 'Publish PR 2 room preview on Pages')
        uses: actions/checkout@v4
        with:
          ref: cbb6998ecf4dc3ad40a0a2a31310305fc8a3f5cf
          path: room-preview-source
          persist-credentials: false

      - name: Prepare static site
        run: |
          mkdir -p dist
          cp -R project/engine project/asset project/license dist/
          cp project/index.html dist/
          touch dist/.nojekyll
          if find dist -type f -name 'api_key.txt' -print -quit | grep -q .; then
            echo 'Refusing to deploy an api_key.txt file to GitHub Pages.' >&2
            exit 1
          fi

      - name: Add the temporary preview under its own URL
        if: github.event_name == 'push' && github.event.before == '431f7b48c1bd8338665ea1783984fe163e81faba' && startsWith(github.event.head_commit.message, 'Publish PR 2 room preview on Pages')
        run: |
          set -euo pipefail
          dest=dist/preview/pr-2
          test ! -e "$dest"
          mkdir -p "$dest"
          cp -R room-preview-source/project/{index.html,engine,asset,license} "$dest/"
          test -z "$(find "$dest" \( -type l -o -iname api_key.txt \) -print -quit)"
          curl --retry 3 -fsSL 'https://querido-fue.github.io/icanfixher/engine/script/scene/title/_studio_room.js' -o "$RUNNER_TEMP/original-room.js"
          cmp dist/engine/script/scene/title/_studio_room.js "$RUNNER_TEMP/original-room.js"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: github-pages-${{ github.run_attempt }}

      # Pages can lag behind the artifact upload response on a fresh run.
      - name: Wait for artifact indexing
        run: sleep 10

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  deploy-game-domain:
    if: ${{ !(github.event_name == 'push' && github.event.before == '431f7b48c1bd8338665ea1783984fe163e81faba' && startsWith(github.event.head_commit.message, 'Publish PR 2 room preview on Pages')) }}
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test Worker
        working-directory: worker
        run: |
          npm ci
          node --test test/*.test.mjs
      - name: Publish game and API on Cloudflare
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Configure the CLOUDFLARE_API_TOKEN repository secret for the jukchang.com zone.'
            exit 1
          fi
          npm run deploy
      - name: Verify the public game and API
        shell: bash
        run: |
          base=https://jukchang.com/icanfixher
          for attempt in {1..12}; do
            if curl -fsS --max-time 15 "$base/?build=$GITHUB_SHA" -o "$RUNNER_TEMP/game.html" &&
               cmp -s project/index.html "$RUNNER_TEMP/game.html" &&
               curl -fsS --max-time 15 "$base/engine/script/scene/title/_studio_room.js?build=$GITHUB_SHA" -o "$RUNNER_TEMP/camera.js" &&
               cmp -s project/engine/script/scene/title/_studio_room.js "$RUNNER_TEMP/camera.js" &&
               curl -fsS --max-time 15 -X OPTIONS -H 'Origin: https://jukchang.com' -H 'Access-Control-Request-Method: POST' -D "$RUNNER_TEMP/game-cors" -o /dev/null https://api.jukchang.com/v1/aero-live &&
               grep -Eiq '^access-control-allow-origin: https://jukchang\.com[[:space:]]*$' "$RUNNER_TEMP/game-cors"; then
              echo 'Verified https://jukchang.com/icanfixher/'
              exit 0
            fi
            sleep 5
          done
          exit 1
