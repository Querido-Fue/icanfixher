name: Check the published temporary studio URL
on:
  push:
    branches: [preview-room-pr-2]
    paths: ['.github/workflows/preview-room-pr-2.yml']
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f575699b0b5c820828cf60cb126d945efd1b169d
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check public files and open the live game
        run: |
          set -euo pipefail
          base=https://querido-fue.github.io/icanfixher/preview/pr-2
          for attempt in {1..12}; do
            if curl -fsSL "$base/engine/script/scene/title/_studio_lens.js?build=f575699b0b5c820828cf60cb126d945efd1b169d" -o "$RUNNER_TEMP/lens.js" &&
              cmp -s project/engine/script/scene/title/_studio_lens.js "$RUNNER_TEMP/lens.js"; then break; fi
            sleep 5
          done
          cmp project/engine/script/scene/title/_studio_lens.js "$RUNNER_TEMP/lens.js"
          for file in index.html engine/title.css engine/script/scene/title/_studio_room.js; do
            curl --retry-all-errors --retry 3 -fsSL "$base/$file" -o "$RUNNER_TEMP/served"
            cmp "project/$file" "$RUNNER_TEMP/served"
          done
          export PREVIEW_URL="$base/" QA_CHROME="$(command -v google-chrome)"
          npm install --no-save --prefix "$RUNNER_TEMP/preview-qa" playwright-core@1.56.1
          cat > "$RUNNER_TEMP/preview-qa/check.mjs" <<'JS'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright-core';
          const browser = await chromium.launch({executablePath:process.env.QA_CHROME,args:['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          try {
            for (const mobile of [false,true]) {
              const page = await browser.newPage({viewport:mobile?{width:390,height:844}:{width:1120,height:720},hasTouch:mobile,isMobile:mobile,deviceScaleFactor:mobile?2:1,reducedMotion:'reduce'});
              const errors = [];
              page.on('pageerror', e=>errors.push(e.message));
              page.on('console', m=>{if(m.type()==='error' && /WebGLProgram|shader error/i.test(m.text()))errors.push(m.text())});
              const response = await page.goto(process.env.PREVIEW_URL,{waitUntil:'domcontentloaded'});
              assert.equal(response.status(),200);
              const canvas=page.locator('.studio-view canvas');
              await canvas.waitFor({timeout:75000});
              await page.locator('#loading-screen:visible').waitFor({state:'hidden',timeout:75000});
              assert.ok(await canvas.evaluate(c=>!!(c.getContext('webgl2')||c.getContext('webgl'))));
              await page.getByRole('button',{name:'플레이 가이드'}).click();
              await page.getByRole('heading',{name:'플레이 가이드'}).waitFor();
              assert.deepEqual(errors,[]);
              console.log(mobile?'Mobile live preview passed':'Desktop live preview passed',page.url());
              await page.close();
            }
          } finally { await browser.close(); }
          JS
          node "$RUNNER_TEMP/preview-qa/check.mjs"
