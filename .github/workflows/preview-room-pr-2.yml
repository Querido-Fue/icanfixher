name: Check the studio's object controls
on:
  push:
    branches: [preview-room-pr-2]
    paths: ['.github/workflows/preview-room-pr-2.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cbb6998ecf4dc3ad40a0a2a31310305fc8a3f5cf
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Open the game and exercise the room controls
        run: |
          set -euo pipefail
          export GAME_URL='https://querido-fue.github.io/icanfixher/preview/pr-2/'
          for attempt in {1..20}; do
            if curl --fail --silent --show-error "${GAME_URL}engine/script/scene/title/_studio_targets.js?build=cbb6998ecf4dc3ad40a0a2a31310305fc8a3f5cf" -o "$RUNNER_TEMP/targets.js" &&
              cmp -s project/engine/script/scene/title/_studio_targets.js "$RUNNER_TEMP/targets.js"; then break; fi
            sleep 5
          done
          cmp project/engine/script/scene/title/_studio_targets.js "$RUNNER_TEMP/targets.js"
          curl -fsSL "${GAME_URL}engine/script/scene/title/_title_scene.js?build=cbb6998ecf4dc3ad40a0a2a31310305fc8a3f5cf" -o "$RUNNER_TEMP/title.js"
          cmp project/engine/script/scene/title/_title_scene.js "$RUNNER_TEMP/title.js"
          curl -fsSL "${GAME_URL}engine/title.css?build=cbb6998ecf4dc3ad40a0a2a31310305fc8a3f5cf" -o "$RUNNER_TEMP/title.css"
          cmp project/engine/title.css "$RUNNER_TEMP/title.css"
          echo "Preview now serving cbb6998ecf4dc3ad40a0a2a31310305fc8a3f5cf"
          npm install --no-save --prefix "$RUNNER_TEMP/studio-browser" playwright-core@1.56.1
          export QA_CHROME="$(command -v google-chrome)"
          cat > "$RUNNER_TEMP/studio-browser/check.mjs" <<'JS'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({executablePath:process.env.QA_CHROME,args:['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          const game=process.env.GAME_URL||'http://127.0.0.1:8765/project/';
          const names=['게임 종료','플레이 가이드','방송 시작'];
          const errors=[];
          async function open(mobile, fallback=false) {
              const page=await browser.newPage({viewport:mobile?{width:390,height:844}:{width:1440,height:900},hasTouch:mobile,isMobile:mobile,deviceScaleFactor:mobile?2:1,reducedMotion:'reduce'});
              page.on('pageerror',e=>errors.push(e.message));
              page.on('console',m=>{if(m.type()==='error' && /WebGLProgram|shader error/i.test(m.text()))errors.push(m.text())});
              if(fallback) await page.addInitScript(()=>{
                  const method=HTMLCanvasElement.prototype.getContext;
                  HTMLCanvasElement.prototype.getContext=function(name,...args) {return name.includes('webgl')?null:method.call(this,name,...args)};
              });
              const response=await page.goto(game,{waitUntil:'domcontentloaded'});
              assert.equal(response.status(),200);
              await page.locator('.studio-view canvas').waitFor({timeout:45000});
              await page.locator('#loading-screen:visible').waitFor({state:'hidden',timeout:45000});
              assert.equal(await page.locator('.studio-title h1,.studio-menu').count(),0);
              for(const name of names) {
                  const button=page.getByRole('button',{name,exact:true});
                  const hit=await button.boundingBox();
                  assert.ok(hit&&hit.width>=44&&hit.height>=44&&hit.x>=0&&hit.y>=0,name+' missing or offscreen');
                  const legal=await button.evaluate(el=>{
                      const b=el.getBoundingClientRect();
                      return b.right<=visualViewport.width+1&&b.bottom<=visualViewport.height+1;
                  });
                  assert.ok(legal,name+' extends offscreen');
                  assert.equal(await button.locator('span').isVisible(),false);
              }
              const canvas=page.locator('.studio-view canvas');
              assert.equal(await canvas.evaluate(c=>!!(c.getContext('webgl2')||c.getContext('webgl'))),!fallback);
              return page;
          }
          async function screenshot(page,name) {
              const bytes=await page.screenshot({path:name+'.jpg',type:'jpeg',quality:82});
              const miniature=await page.evaluate(async data=>{
                  const img=new Image();img.src=data;await img.decode();
                  const canvas=document.createElement('canvas'), ratio=Math.min(720/img.width,570/img.height);
                  canvas.width=Math.round(img.width*ratio);canvas.height=Math.round(img.height*ratio);
                  canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
                  return canvas.toDataURL('image/jpeg',0.70).split(',')[1];
              },'data:image/jpeg;base64,'+bytes.toString('base64'));
              console.log('STUDIO-'+name+' '+miniature);
          }
          try {
              const desktop=await open(false);
              if (!process.env.GAME_URL) await screenshot(desktop,'desktop');
              const hover=desktop.getByRole('button',{name:names[2],exact:true});
              await hover.hover();
              await hover.locator('span').waitFor({state:'visible'});
              if (!process.env.GAME_URL) await screenshot(desktop,'hover');
              await desktop.mouse.move(12,12);
              await hover.locator('span').waitFor({state:'hidden'});
              await desktop.keyboard.press('Tab');
              const door=desktop.getByRole('button',{name:names[0],exact:true});
              assert.ok(await door.evaluate(el=>el===document.activeElement));
              await door.locator('span').waitFor({state:'visible'});
              await desktop.keyboard.press('Enter');
              await desktop.getByRole('heading',{name:'방송실을 나갈까요?'}).waitFor();
              await desktop.keyboard.press('Escape');
              await door.waitFor();
              assert.ok(await door.evaluate(el=>el===document.activeElement));
              await desktop.keyboard.press('ArrowRight');
              await desktop.keyboard.press('Enter');
              await desktop.getByRole('heading',{name:names[1]}).waitFor();
              await desktop.getByRole('button',{name:'방으로 돌아가기'}).click();
              await hover.click();
              await desktop.locator('.studio-title').waitFor({state:'detached',timeout:20000});
              await desktop.close();
              const mobile=await open(true);
              if (!process.env.GAME_URL) await screenshot(mobile,'mobile');
              const record=mobile.getByRole('button',{name:names[1],exact:true});
              await record.tap();
              await record.locator('span').waitFor({state:'visible'});
              assert.equal(await mobile.locator('.studio-detail').isVisible(),false);
              if (!process.env.GAME_URL) await screenshot(mobile,'touch');
              await record.tap();
              await mobile.getByRole('heading',{name:names[1]}).waitFor();
              await mobile.getByRole('button',{name:'방으로 돌아가기'}).tap();
              await mobile.setViewportSize({width:844,height:390});
              const start=mobile.getByRole('button',{name:names[2],exact:true});
              await start.waitFor();
              await mobile.waitForFunction(()=>{
                  const e=document.querySelector('.studio-hotspot[data-station="desk"]');
                  const r=e.getBoundingClientRect();
                  return r.right<=visualViewport.width+1 && r.bottom<=visualViewport.height+1;
              });
              await start.tap({timeout:12000});
              await start.locator('span').waitFor({state:'visible'});
              await mobile.close();
              const fallback=await open(true,true);
              await fallback.close();
              assert.deepEqual(errors,[]);
              console.log('Verified glow shader, hover, keyboard, touch, rotation and software fallback',game);
          } finally {await browser.close()}
          JS
          node "$RUNNER_TEMP/studio-browser/check.mjs"
